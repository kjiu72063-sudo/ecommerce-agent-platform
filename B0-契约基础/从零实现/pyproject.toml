[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agent-platform-contracts"
version = "0.2.0"
description = "B0 Agent Platform Contracts - Pydantic v2 reference models"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.20",
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
