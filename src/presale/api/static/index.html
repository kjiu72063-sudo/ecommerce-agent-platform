<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>售前问答演示 · Presale QA</title>
<style>
  :root {
    --ink: #1a2233;
    --muted: #6b7487;
    --line: #e3e7ef;
    --bg: #f6f7fb;
    --card: #ffffff;
    --accent: #2563eb;
    --accent-ink: #ffffff;
    --green: #16a34a;
    --green-bg: #ecfdf3;
    --amber: #d97706;
    --amber-bg: #fffbeb;
    --chip-bg: #eef2ff;
  }
  * { box-sizing: border-box; }
  /* display:grid/flex on panels overrides the UA [hidden] rule — reassert it */
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header h1 span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 10px; }
  .mode-badges { display: flex; gap: 8px; }
  .layout {
    max-width: 1080px;
    margin: 24px auto;
    padding: 0 16px;
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 16px;
    align-items: start;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .section-title { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  select, textarea {
    width: 100%;
    font: inherit;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    background: #fff;
  }
  select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  textarea { resize: vertical; min-height: 72px; margin-top: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip {
    font: inherit;
    font-size: 13px;
    text-align: left;
    background: var(--chip-bg);
    color: #3730a3;
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }
  .actions { margin-top: 14px; display: flex; align-items: center; gap: 14px; }
  button.ask {
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 8px;
    padding: 10px 28px;
    cursor: pointer;
  }
  button.ask:disabled { opacity: .55; cursor: wait; }
  .hint { font-size: 12px; color: var(--muted); }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .badge {
    font-size: 12px;
    font-weight: 600;
    border-radius: 6px;
    padding: 3px 10px;
    background: var(--chip-bg);
    color: #3730a3;
  }
  .badge.ok { background: var(--green-bg); color: var(--green); }
  .badge.warn { background: var(--amber-bg); color: var(--amber); }
  .badge.mute { background: #f1f5f9; color: #475569; }
  .answer { font-size: 15px; white-space: pre-wrap; }
  .evi-list { display: flex; flex-direction: column; gap: 6px; }
  .evi-item { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .evi-loc {
    width: 100%;
    font: inherit;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 12px;
    text-align: left;
    background: var(--green-bg);
    color: #15803d;
    border: none;
    padding: 8px 12px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .evi-loc:hover { filter: brightness(0.97); }
  .evi-loc .arrow { transition: transform .15s; font-size: 10px; }
  .evi-item.open .evi-loc .arrow { transform: rotate(90deg); }
  .evi-body {
    font-size: 13px;
    color: var(--ink);
    background: #fafbfe;
    padding: 10px 12px;
    border-top: 1px dashed var(--line);
    white-space: pre-wrap;
  }
  .meta {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
    font-size: 12px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    align-items: center;
  }
  .fb-btn {
    font: inherit;
    font-size: 13px;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 6px;
    padding: 3px 12px;
    cursor: pointer;
    margin-left: auto;
  }
  .fb-btn:hover { border-color: var(--accent); }
  .fb-btn.active { background: var(--chip-bg); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .history { position: sticky; top: 16px; padding: 14px; }
  .history-list { list-style: none; margin: 0; padding: 0; max-height: 480px; overflow-y: auto; }
  .history-list li {
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    margin-bottom: 4px;
    display: flex;
    gap: 8px;
    align-items: baseline;
  }
  .history-list li:hover { background: var(--chip-bg); border-color: #c7d2fe; }
  .history-list .q {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; }
  .dot.ok { background: var(--green); }
  .dot.warn { background: var(--amber); }
  .history-empty { font-size: 12px; color: var(--muted); }
  .error { border-color: #fecaca; background: #fef2f2; color: #b91c1c; font-size: 14px; }
  .tabs {
    max-width: 1080px;
    margin: 20px auto 0;
    padding: 0 16px;
    display: flex;
    gap: 8px;
  }
  .tab {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    padding: 8px 22px;
    cursor: pointer;
  }
  .tab.active {
    color: var(--accent);
    background: var(--card);
    border-color: var(--line);
  }
  #panel-review { max-width: 860px; margin: 0 auto 30px; padding: 0 16px; }
  .review-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .sentiment-pos { background: var(--green-bg); color: var(--green); }
  .sentiment-neg { background: #fef2f2; color: #b91c1c; }
  .sentiment-neu { background: #f1f5f9; color: #475569; }
  .kw-chip {
    font-size: 13px;
    background: var(--chip-bg);
    color: #3730a3;
    border-radius: 999px;
    padding: 4px 12px;
  }
  .platform-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .timeline { margin-top: 8px; padding-left: 4px; }
  .tl-item { position: relative; padding: 0 0 14px 22px; border-left: 2px solid var(--line); margin-left: 7px; }
  .tl-item:last-child { padding-bottom: 2px; border-left-color: transparent; }
  .tl-item::before {
    content: "";
    position: absolute;
    left: -7px; top: 3px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--accent);
  }
  .tl-item.done::before { background: var(--green); border-color: var(--green); }
  .tl-title { font-size: 13px; font-weight: 600; color: var(--ink); }
  .tl-meta { font-size: 12px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; }
  .relay-agents { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .relay-agent { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: #fafbfe; }
  .relay-agent .ra-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .relay-agent .ra-name { font-weight: 600; font-size: 13px; }
  .relay-agent .ra-answer { font-size: 13px; color: var(--ink); white-space: pre-wrap; }
  .relay-arrow { text-align: center; color: var(--muted); font-size: 12px; margin: -4px 0; }
  button.relay-btn {
    font: inherit;
    font-size: 13px;
    border: 1px solid var(--accent);
    background: #fff;
    color: var(--accent);
    border-radius: 6px;
    padding: 3px 12px;
    cursor: pointer;
    margin-left: 0;
  }
  button.relay-btn:hover { background: var(--chip-bg); }
  button.relay-btn:disabled { opacity: .55; cursor: wait; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .history { position: static; }
  }
</style>
</head>
<body>
<header>
  <h1>售前问答演示<span>Presale QA · 商品知识检索 + LLM 生成</span></h1>
  <div class="mode-badges" id="mode-badges">
    <span class="badge mute">检测中…</span>
  </div>
</header>
<nav class="tabs">
  <button type="button" class="tab active" data-panel="panel-qa">售前问答</button>
  <button type="button" class="tab" data-panel="panel-review">评论分析</button>
</nav>
<main class="layout" id="panel-qa">
  <aside class="card history">
    <div class="section-title">问答历史</div>
    <ul class="history-list" id="history-list"></ul>
    <div class="history-empty" id="history-empty">暂无记录</div>
  </aside>

  <div class="content">
    <section class="card">
      <label for="product">选择商品</label>
      <select id="product"></select>
      <div class="chips" id="chips"></div>
      <label for="question" style="margin-top:12px">你的问题</label>
      <textarea id="question" placeholder="例如：大热天在太阳底下曝晒一整天会不会晒黑"></textarea>
      <div class="actions">
        <button class="ask" id="ask">提问</button>
        <span class="hint">Ctrl/⌘ + Enter 提交</span>
      </div>
    </section>

    <section class="card" id="result" hidden>
      <div class="badges" id="badges"></div>
      <div class="answer" id="answer"></div>
      <div id="evidence-block" hidden>
        <div class="section-title" style="margin-top:16px">引用的商品知识字段（点击展开原文）</div>
        <div class="evi-list" id="evidence"></div>
      </div>
      <div id="timeline-block" hidden>
        <div class="section-title" style="margin-top:16px">运行时间线（B0 契约 · 全程可追溯）</div>
        <div class="platform-row" id="platform-row"></div>
        <div class="timeline" id="timeline"></div>
      </div>
      <div class="meta" id="meta"></div>
    </section>

    <section class="card" id="relay" hidden>
      <div class="section-title">多 Agent 接力（AgentCoordinator：Presale QA → ReviewAnalyzer）</div>
      <div id="relay-badges" class="badges"></div>
      <div class="relay-agents" id="relay-agents"></div>
    </section>

    <section class="card error" id="error" hidden></section>
  </div>
</main>

<section id="panel-review" hidden>
  <div class="review-card">
    <label for="review-text">评论原文（第二个业务 Agent：情感分析 + 关键词提取）</label>
    <div class="chips" id="review-chips"></div>
    <textarea id="review-text" style="margin-top:12px" placeholder="粘贴一条商品评论，例如：鞋子收到了，非常满意！"></textarea>
    <div class="actions">
      <button class="ask" id="review-ask">分析评论</button>
      <span class="hint">确定性规则，无需 LLM</span>
    </div>
  </div>
  <div class="review-card" id="review-result" hidden>
    <div class="badges" id="review-badges"></div>
    <div class="section-title" style="margin-top:6px">命中关键词</div>
    <div class="chips" id="review-keywords"></div>
    <div class="answer" id="review-answer" style="margin-top:14px"></div>
  </div>
  <div class="review-card error" id="review-error" hidden></div>
</section>
<script>
(function () {
  "use strict";
  var examples = null;
  var currentRunRef = null;
  var currentSessionId = null;
  var relayCtx = null;
  var $ = function (id) { return document.getElementById(id); };

  var STAGE_NAMES = {
    submitted: "问题提交",
    knowledge_retrieved: "知识检索",
    context_built: "上下文组装",
    answer_generated: "答案生成",
    failed: "失败"
  };
  var AGENT_NAMES = {
    "presale-qa": "售前问答 Agent",
    "review-analyzer": "评论分析 Agent"
  };

  function renderTimeline(body) {
    var block = $("timeline-block");
    var stages = body.timeline || [];
    if (!stages.length) { block.hidden = true; return; }
    block.hidden = false;

    var row = $("platform-row");
    row.innerHTML = "";
    var platformBadges = ["B0 契约", "幂等可追溯", "需人工复核处置"];
    if (body.disposition) platformBadges.push("disposition: " + body.disposition);
    var refs = Object.keys(body.configuration_refs || {});
    if (refs.length) platformBadges.push(refs.length + " 配置指纹");
    platformBadges.forEach(function (t) { row.appendChild(badge("mute", t)); });

    var box = $("timeline");
    box.innerHTML = "";
    stages.forEach(function (s, i) {
      var item = document.createElement("div");
      item.className = "tl-item" + (i === stages.length - 1 ? " done" : "");
      var title = document.createElement("div");
      title.className = "tl-title";
      title.textContent = (STAGE_NAMES[s.stage] || s.stage) + " · " + s.detail;
      var meta = document.createElement("div");
      meta.className = "tl-meta";
      var t = "";
      try { t = new Date(s.occurred_at).toLocaleTimeString(); } catch (e) { t = s.occurred_at; }
      meta.textContent = t;
      item.appendChild(title);
      item.appendChild(meta);
      box.appendChild(item);
    });
  }

  async function runRelay() {
    if (!relayCtx || !relayCtx.question) return;
    var btn = document.getElementById("relay-btn");
    if (btn) { btn.disabled = true; btn.textContent = "接力中…"; }
    try {
      var resp = await fetch("/api/v1/coordinator/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          question: relayCtx.question,
          product_id: relayCtx.product_id,
          tenant_id: examples.tenant_id,
          idempotency_key: "relay-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10)
        })
      });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      var data = await resp.json();
      var badges = $("relay-badges");
      badges.innerHTML = "";
      badges.appendChild(badge(data.overall_terminal === "finalize" ? "ok" : "warn",
        "整体终态：" + data.overall_terminal));
      badges.appendChild(badge("mute", data.agents.length + " 个 Agent · " + data.seconds + "s"));
      if (data.short_circuited) badges.appendChild(badge("warn", "首个 NEED_HUMAN 短路"));

      var box = $("relay-agents");
      box.innerHTML = "";
      data.pipeline.forEach(function (step, i) {
        if (i > 0) {
          var arrow = document.createElement("div");
          arrow.className = "relay-arrow";
          arrow.textContent = "↓ 上一步答案作为下一步输入（顺序编排）";
          box.appendChild(arrow);
        }
        var card = document.createElement("div");
        card.className = "relay-agent";
        var head = document.createElement("div");
        head.className = "ra-head";
        var name = document.createElement("span");
        name.className = "ra-name";
        name.textContent = AGENT_NAMES[step.agent] || step.agent;
        head.appendChild(name);
        head.appendChild(badge(step.terminal === "finalize" ? "ok" : "warn", step.terminal));
        if (step.need_human) head.appendChild(badge("warn", "需人工复核"));
        var ans = document.createElement("div");
        ans.className = "ra-answer";
        ans.textContent = step.answer_preview || "（无答案）";
        card.appendChild(head);
        card.appendChild(ans);
        box.appendChild(card);
      });
      $("relay").hidden = false;
      $("relay").scrollIntoView({ behavior: "smooth", block: "nearest" });
    } catch (e) {
      var badges2 = $("relay-badges");
      badges2.innerHTML = "";
      badges2.appendChild(badge("warn", "接力失败：" + e.message));
      $("relay").hidden = false;
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = "多 Agent 接力"; }
    }
  }

  function badge(cls, text) {
    var s = document.createElement("span");
    s.className = "badge " + cls;
    s.textContent = text;
    return s;
  }

  async function loadConfig() {
    var box = $("mode-badges");
    box.innerHTML = "";
    try {
      var r = await fetch("/api/v1/presale/qa/config");
      if (!r.ok) throw new Error("HTTP " + r.status);
      var c = await r.json();
      if (c.llm === "real") {
        box.appendChild(badge("ok", "真实 LLM · " + (c.model || "")));
      } else {
        box.appendChild(badge("mute", "模板生成"));
      }
      var retrievalNames = { hybrid: "Hybrid 检索", qdrant: "Qdrant 检索", external: "外部检索", deterministic: "确定性检索" };
      if (c.retrieval === "hybrid" || c.retrieval === "qdrant") {
        box.appendChild(badge("ok", retrievalNames[c.retrieval] || c.retrieval));
      } else {
        box.appendChild(badge("mute", retrievalNames[c.retrieval] || c.retrieval));
      }
    } catch (e) {
      box.appendChild(badge("mute", "配置未知"));
    }
  }

  function renderChips(questions) {
    var box = $("chips");
    box.innerHTML = "";
    questions.forEach(function (q) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = q;
      b.addEventListener("click", function () { $("question").value = q; });
      box.appendChild(b);
    });
  }

  function onProductChange() {
    var p = examples.products.find(function (x) { return x.product_id === $("product").value; });
    if (p) {
      renderChips(p.questions);
      $("question").placeholder = p.questions[0] || "";
      currentSessionId = null; // switching product starts a fresh conversation
    }
  }

  function renderEvidence(evi) {
    var box = $("evidence");
    box.innerHTML = "";
    evi.forEach(function (e) {
      var item = document.createElement("div");
      item.className = "evi-item";
      var loc = document.createElement("button");
      loc.type = "button";
      loc.className = "evi-loc";
      var name = document.createElement("span");
      name.textContent = e.locator;
      var arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = "▶";
      loc.appendChild(name);
      loc.appendChild(arrow);
      var body = document.createElement("div");
      body.className = "evi-body";
      body.hidden = true;
      body.textContent = e.content || "（无内容预览）";
      loc.addEventListener("click", function () {
        body.hidden = !body.hidden;
        item.classList.toggle("open", !body.hidden);
      });
      item.appendChild(loc);
      item.appendChild(body);
      box.appendChild(item);
    });
  }

  function renderResult(body, seconds, opts) {
    opts = opts || {};
    if (opts.question) relayCtx = { question: opts.question, product_id: opts.product_id };
    currentRunRef = typeof body.run_ref === "string" ? body.run_ref : (body.run_ref && body.run_ref.id) || null;

    var badges = $("badges");
    badges.innerHTML = "";
    var terminal = body.terminal || "unknown";
    if (terminal === "finalize" && !body.need_human) {
      badges.appendChild(badge("ok", "已生成答案"));
    } else {
      badges.appendChild(badge("warn", "建议人工复核（" + terminal + "）"));
    }
    var call = (body.steps || []).map(function (s) { return (s.tool_calls || [])[0]; }).filter(Boolean)[0];
    if (call) {
      if (call.status === "matched") {
        badges.appendChild(badge("ok", "检索命中 " + call.evidence_count + " 条证据"));
      } else if (call.status === "out_of_scope") {
        badges.appendChild(badge("warn", "超出商品范围"));
      } else {
        badges.appendChild(badge("warn", "未命中商品知识"));
      }
    }
    if (body.confidence_signal === "supported") {
      badges.appendChild(badge("ok", "证据充分"));
    } else if (body.confidence_signal) {
      badges.appendChild(badge("warn", "置信度：" + body.confidence_signal));
    }

    $("answer").textContent = body.answer_text || "（无答案文本）";

    var evi = body.evidence || [];
    $("evidence-block").hidden = evi.length === 0;
    if (evi.length) renderEvidence(evi);
    renderTimeline(body);

    var meta = $("meta");
    meta.innerHTML = "";
    [
      "耗时 " + seconds + "s",
      body.run_ref ? "run " + String(typeof body.run_ref === "string" ? body.run_ref : (body.run_ref.id || "")) : "",
      body.reason_codes && body.reason_codes.length ? "reasons: " + body.reason_codes.join(", ") : ""
    ].filter(Boolean).forEach(function (text) {
      var s = document.createElement("span");
      s.textContent = text;
      meta.appendChild(s);
    });

    var fb = document.createElement("button");
    fb.type = "button";
    fb.className = "fb-btn";
    fb.textContent = "👍 有帮助";
    fb.addEventListener("click", function () { sendFeedback("up", fb, downBtn); });
    var downBtn = document.createElement("button");
    downBtn.type = "button";
    downBtn.className = "fb-btn";
    downBtn.style.marginLeft = "0";
    downBtn.textContent = "👎 需改进";
    downBtn.addEventListener("click", function () { sendFeedback("down", downBtn, fb); });
    meta.appendChild(fb);
    meta.appendChild(downBtn);
    if (relayCtx && relayCtx.question) {
      var relayBtn = document.createElement("button");
      relayBtn.type = "button";
      relayBtn.id = "relay-btn";
      relayBtn.className = "fb-btn relay-btn";
      relayBtn.style.marginLeft = "0";
      relayBtn.textContent = "多 Agent 接力";
      relayBtn.addEventListener("click", runRelay);
      meta.appendChild(relayBtn);
    }
    if (opts.rating) {
      (opts.rating === "up" ? fb : downBtn).classList.add("active");
    }

    $("result").hidden = false;
    $("error").hidden = true;
  }

  async function sendFeedback(rating, activeBtn, otherBtn) {
    if (!currentRunRef) return;
    try {
      var r = await fetch("/api/v1/presale/qa/feedback", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ run_ref: currentRunRef, rating: rating })
      });
      if (r.ok) {
        activeBtn.classList.add("active");
        otherBtn.classList.remove("active");
      }
    } catch (e) { /* demo: ignore */ }
  }

  function renderError(message) {
    $("result").hidden = true;
    $("error").textContent = message;
    $("error").hidden = false;
  }

  async function loadHistory() {
    try {
      var r = await fetch("/api/v1/presale/qa/history?limit=20");
      if (!r.ok) return;
      var data = await r.json();
      var list = $("history-list");
      list.innerHTML = "";
      $("history-empty").hidden = (data.items || []).length > 0;
      (data.items || []).forEach(function (item) {
        var li = document.createElement("li");
        var dot = document.createElement("span");
        dot.className = "dot " + (item.terminal === "finalize" && !item.need_human ? "ok" : "warn");
        var q = document.createElement("span");
        q.className = "q";
        q.textContent = item.question;
        q.title = item.question;
        li.appendChild(dot);
        li.appendChild(q);
        li.addEventListener("click", function () {
          if (item.response) {
            renderResult(item.response, item.seconds, {
              question: item.question,
              product_id: item.product_id
            });
          }
        });
        list.appendChild(li);
      });
    } catch (e) { /* demo: ignore */ }
  }

  function parseSseBlock(block) {
    var event = "message";
    var data = "";
    block.split("\n").forEach(function (line) {
      if (line.indexOf("event: ") === 0) event = line.slice(7).trim();
      else if (line.indexOf("data: ") === 0) data += line.slice(6);
    });
    try { return { event: event, data: JSON.parse(data) }; } catch (e) { return null; }
  }

  function showStreamingSkeleton() {
    $("result").hidden = false;
    $("error").hidden = true;
    var badges = $("badges");
    badges.innerHTML = "";
    badges.appendChild(badge("mute", "检索中…"));
    $("answer").textContent = "";
    $("evidence-block").hidden = true;
    $("meta").innerHTML = "";
  }

  function renderStreamEvidence(data) {
    var badges = $("badges");
    badges.innerHTML = "";
    if (data.retrieval_status === "matched") {
      badges.appendChild(badge("ok", "检索命中 " + (data.evidence || []).length + " 条证据"));
    } else {
      badges.appendChild(badge("warn", "未命中商品知识"));
    }
    badges.appendChild(badge("mute", "生成中…"));
    if (data.evidence && data.evidence.length) {
      $("evidence-block").hidden = false;
      renderEvidence(data.evidence);
    }
  }

  async function askFallback(payload, t0) {
    var resp = await fetch("/api/v1/presale/qa", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    var seconds = ((performance.now() - t0) / 1000).toFixed(1);
    if (!resp.ok) {
      var detail = "";
      try { detail = (await resp.json()).detail || ""; } catch (e) {}
      renderError("请求失败（HTTP " + resp.status + "）" + (detail ? "：" + detail : ""));
      return;
    }
    renderResult(await resp.json(), seconds, { question: payload.question, product_id: payload.product_id });
    loadHistory();
  }

  async function ask() {
    var question = $("question").value.trim();
    if (!question) { renderError("请先输入问题（或点上面的示例问题）。"); return; }
    if (!examples) { renderError("示例配置未加载，刷新重试。"); return; }
    var btn = $("ask");
    btn.disabled = true;
    btn.textContent = "思考中…";
    var t0 = performance.now();
    var payload = {
      question: question,
      product_id: $("product").value,
      tenant_id: examples.tenant_id,
      idempotency_key: "demo-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10),
      session_id: currentSessionId
    };
    showStreamingSkeleton();
    try {
      var resp = await fetch("/api/v1/presale/qa/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!resp.ok || !resp.body) throw new Error("HTTP " + resp.status);
      var reader = resp.body.getReader();
      var decoder = new TextDecoder();
      var buf = "";
      var donePayload = null;
      for (;;) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buf += decoder.decode(chunk.value, { stream: true });
        var idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          var block = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          var msg = parseSseBlock(block);
          if (!msg) continue;
          if (msg.event === "evidence") renderStreamEvidence(msg.data);
          else if (msg.event === "token") $("answer").textContent += msg.data.text;
          else if (msg.event === "done") donePayload = msg.data;
          else if (msg.event === "error") throw new Error(msg.data.detail || "stream error");
        }
      }
      if (!donePayload) throw new Error("流结束但无 done 事件");
      var seconds = ((performance.now() - t0) / 1000).toFixed(1);
      currentSessionId = donePayload.session_id || currentSessionId;
      renderResult(donePayload, seconds, { question: payload.question, product_id: payload.product_id });
      loadHistory();
    } catch (e) {
      // Streaming unavailable → single-shot fallback (same payload, no session).
      try {
        var copy = Object.assign({}, payload);
        delete copy.session_id;
        await askFallback(copy, t0);
      } catch (e2) {
        renderError("网络错误：" + e2.message);
      }
    } finally {
      btn.disabled = false;
      btn.textContent = "提问";
    }
  }

  function renderReviewChips(samples) {
    var box = $("review-chips");
    box.innerHTML = "";
    (samples || []).forEach(function (s) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = s.length > 22 ? s.slice(0, 22) + "…" : s;
      b.title = s;
      b.addEventListener("click", function () { $("review-text").value = s; });
      box.appendChild(b);
    });
  }

  function renderReviewResult(body) {
    var badges = $("review-badges");
    badges.innerHTML = "";
    var sentiment = body.sentiment || "neutral";
    var cls = sentiment === "positive" ? "sentiment-pos" : (sentiment === "negative" ? "sentiment-neg" : "sentiment-neu");
    var names = { positive: "正面情感", negative: "负面情感", neutral: "中性情感" };
    var s = document.createElement("span");
    s.className = "badge " + cls;
    s.textContent = names[sentiment] || sentiment;
    badges.appendChild(s);
    badges.appendChild(badge("warn", "建议人工复核"));
    if (body.evidence_count > 0) {
      badges.appendChild(badge("ok", "关联商品知识 " + body.evidence_count + " 条"));
    }

    var kw = $("review-keywords");
    kw.innerHTML = "";
    (body.keywords || []).forEach(function (word) {
      var k = document.createElement("span");
      k.className = "kw-chip";
      k.textContent = word;
      kw.appendChild(k);
    });
    if (!(body.keywords || []).length) {
      var none = document.createElement("span");
      none.className = "kw-chip";
      none.textContent = "无命中";
      kw.appendChild(none);
    }

    $("review-answer").textContent = body.answer_text || "";
    $("review-result").hidden = false;
    $("review-error").hidden = true;
  }

  async function analyzeReview() {
    var text = $("review-text").value.trim();
    if (!text) {
      $("review-result").hidden = true;
      $("review-error").textContent = "请先粘贴或点选一条评论。";
      $("review-error").hidden = false;
      return;
    }
    var btn = $("review-ask");
    btn.disabled = true;
    btn.textContent = "分析中…";
    try {
      var payload = { text: text };
      if (examples && $("product").value) payload.product_id = $("product").value;
      var resp = await fetch("/api/v1/review/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!resp.ok) {
        var detail = "";
        try { detail = (await resp.json()).detail || ""; } catch (e) {}
        $("review-result").hidden = true;
        $("review-error").textContent = "分析失败（HTTP " + resp.status + "）" + (detail ? "：" + detail : "");
        $("review-error").hidden = false;
        return;
      }
      renderReviewResult(await resp.json());
    } catch (e) {
      $("review-error").textContent = "网络错误：" + e.message;
      $("review-error").hidden = false;
    } finally {
      btn.disabled = false;
      btn.textContent = "分析评论";
    }
  }

  function bindTabs() {
    var tabs = document.querySelectorAll(".tab");
    tabs.forEach(function (tab) {
      tab.addEventListener("click", function () {
        tabs.forEach(function (t) { t.classList.remove("active"); });
        tab.classList.add("active");
        ["panel-qa", "panel-review"].forEach(function (id) {
          $(id).hidden = (id !== tab.dataset.panel);
        });
      });
    });
  }

  async function init() {
    bindTabs();
    loadConfig();
    loadHistory();
    try {
      var resp = await fetch("/api/v1/presale/qa/examples");
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      examples = await resp.json();
      var sel = $("product");
      examples.products.forEach(function (p) {
        var opt = document.createElement("option");
        opt.value = p.product_id;
        opt.textContent = p.name + "（" + p.product_id + "）";
        sel.appendChild(opt);
      });
      sel.addEventListener("change", onProductChange);
      onProductChange();
      renderReviewChips(examples.review_samples);
    } catch (e) {
      renderError("加载示例失败：" + e.message);
    }
    $("ask").addEventListener("click", ask);
    $("question").addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) ask();
    });
    $("review-ask").addEventListener("click", analyzeReview);
    $("review-text").addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) analyzeReview();
    });
  }
  init();
})();
</script>
</body>
