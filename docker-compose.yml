# 本地可复现的外部环境栈（RAG 相关）。
# 一键拉起：docker compose up -d
# 停止：docker compose down
# 说明见 deploy/README.md

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://etcd:2379"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus:
    # 单机独立模式，用本地文件存储（storageType=local），不依赖 MinIO。
    # 注：本机 1Panel 镜像站未缓存 minio 镜像（docker pull 会 403），故不走对象存储；
    # 生产/正式若要 MinIO 对象存储，可加回 minio 服务并把 COMMON_STORAGETYPE 改回 remote。
    image: milvusdb/milvus:v2.4.1
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      COMMON_STORAGETYPE: local
      COMMON_LOCALSTORAGEPATH: /var/lib/milvus
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy

  # RAG 阶段 2（GraphRAG）预留：接实体/关系图谱后启用
  # neo4j:
  #   image: neo4j:5.26.0
  #   environment:
  #     NEO4J_AUTH: neo4j/presale-graph
  #     NEO4J_server_memory_heap_max__size: 512m
  #   ports:
  #     - "7474:7474"
  #     - "7687:7687"
  #   volumes:
  #     - neo4j_data:/data

  postgres:
    image: postgres:15-alpine
    profiles: ["postgres", "production"]
    environment:
      POSTGRES_DB: presale
      POSTGRES_USER: presale
      POSTGRES_PASSWORD: ${PRESALE_PG_PASSWORD:-presale}
      PRESALE_PG_PRODUCTION: ${PRESALE_PG_PRODUCTION:-0}
      # A second compose file (deploy/postgres.production.yml) sets this to 1.
    ports:
      - "5432:5432"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ "$$PRESALE_PG_PRODUCTION" = "1" ]; then
          case "$$PRESALE_PG_PASSWORD" in
            ""|presale) echo "production profile requires PRESALE_PG_PASSWORD" >&2; exit 1 ;;
          esac
        fi
        exec docker-entrypoint.sh postgres \
          -c logging_collector=on \
          -c log_directory=/var/log/postgresql \
          -c log_truncate_on_rotation=on
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - presale_pg_logs:/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presale -d presale"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  qdrant_data:
  etcd_data:
  milvus_data:
  postgres_data:
  presale_pg_logs:
  # neo4j_data:
