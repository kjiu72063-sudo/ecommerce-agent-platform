[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-agent-platform"
version = "0.1.0"
description = "E-commerce AI Agent platform foundation and staged runtime components"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<0.28",
    "pydantic>=2.9,<3.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<0.28",
    "jsonschema>=4.20,<5.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "rank-bm25>=0.2,<1.0",
]
quality = [
    "pre-commit>=3.7,<5.0",
    "pyright>=1.1,<2.0",
    "ruff>=0.8,<1.0",
]
hybrid = [
    "pymilvus>=2.4,<3.0",
]
# 真实语义 embedding（bge-large-zh-v1.5 + torch）。体积大，仅本地/按需安装；
# CI 集成 job 用 deterministic 嵌入，不装本 extra，避免每次拉 torch。
embedding = [
    "sentence-transformers>=2.7,<5.0",
]

[project.scripts]
presale-qa-api = "presale.api.qa:main"
presale-index = "presale.adapters.qdrant_retrieval:main"
presale-index-hybrid = "presale.adapters.hybrid_retrieval:main"
presale-eval-retrieval = "presale.adapters.retrieval_eval:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src/presale", "src/agent_runtime"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportMissingImports = true
reportUnreachable = true
