[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-agent-platform"
version = "0.1.0"
description = "E-commerce AI Agent platform foundation and staged runtime components"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<0.28",
    "jsonschema>=4.20,<5.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
]
quality = [
    "pre-commit>=3.7,<5.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
